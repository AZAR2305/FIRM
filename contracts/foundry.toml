[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "../deployments" }]

[invariant]
runs = 64
depth = 32

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[lint]
exclude_lints = ["block-timestamp", "unsafe-typecast", "asm-keccak256", "mixed-case-function", "mixed-case-variable", "screaming-snake-case-const", "screaming-snake-case-immutable", "unaliased-plain-import", "divide-before-multiply"]
